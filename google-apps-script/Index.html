  <title>Miltier Family Recipes</title>
<style>

nt-size:14px;outline-offset:1px}.search input::placeholder{color:#000;opacity:1}.sort{display:flex;gap:12px;align-items:center;border:1px solid #000;padding:8px 16px;font-size:12px}.sort select{border:0;background:#fff;font-size:13px;max-width:160px}.categories{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 20px}.category{border:1px solid #000;border-radius:0;padding:7px 17px;font-size:12px}.category[aria-pressed=true]{background:#000;color:#fff}.result-count{font-size:12px;margin:20px 0}.recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.recipe-card{border:1px solid #000;display:flex;flex-direction:column;min-height:250px;padding:24px;position:relative}.card-category{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;padding-right:32px}.recipe-card h3{font:28px/1.15 Georgia,serif;margin-bottom:12px}.card-open{border:0;padding:0;background:none;text-align:left;font:inherit}.card-open:after{content:'';position:absolute;inset:0}.card-source{font-size:13px;margin-bottom:30px}.card-meta{border-top:1px solid #000;padding-top:14px;display:flex;justify-content:space-between;gap:12px;margin-top:auto;font-size:11px}.save{position:absolute;right:18px;top:16px;z-index:1;border:0;font-size:24px;padding:0 6px;line-height:1.5}.empty{border:1px solid #000;text-align:center;padding:50px 24px 58px}.empty-mark{display:block;font:56px Georgia,serif;margin-bottom:18px}.empty h3{font:30px Georgia,serif;margin-bottom:12px}.empty p{max-width:440px;margin:0 auto 20px;font-size:14px}.button{background:#000;color:#fff;border:1px solid #000;padding:10px 20px;font-size:13px}.button:hover{background:#fff;color:#000}.empty[hidden],[hidden]{display:none!important}footer{border-top:1px solid #000;padding:24px 0 36px;display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:1px}footer span:last-child{font:italic 14px Georgia,serif;letter-spacing:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}.skip{position:absolute;top:-80px;left:20px;background:#fff;padding:12px;z-index:5}.skip:focus{top:10px}dialog{width:min(900px,calc(100% - 32px));max-height:calc(100dvh - 32px);padding:32px 44px 44px;border:1px solid #000;color:#000;background:#fff}dialog::backdrop{background:rgb(0 0 0 / 65%)}body:has(dialog[open]){overflow:hidden}.dialog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #000;padding-bottom:18px;margin-bottom:32px}.detail-title{font:44px/1.1 Georgia,serif;margin:12px 0 18px}.detail-meta{font-size:13px}.story{border-top:1px solid #000;padding-top:20px;white-space:pre-line}.serving-control{display:flex;gap:14px;align-items:center;margin:25px 0;font-size:14px}.serving-control input{width:76px;border:1px solid #000;padding:6px 8px;background:#fff}.recipe-columns{display:grid;grid-template-columns:1fr 1.5fr;gap:40px;border-top:1px solid #000;padding-top:24px}.recipe-columns h3,.detail-extras h3{font:24px Georgia,serif}.ingredients{list-style:none;padding:0}.ingredients li{border-bottom:1px solid #000;padding:10px 0;font-size:14px}.directions{padding-left:22px;font-size:14px}.directions li{padding-left:7px;margin-bottom:18px;white-space:pre-line}.detail-extras{border-top:1px solid #000;margin-top:24px;padding-top:24px;font-size:14px}.detail-extras h3{margin-bottom:12px}.detail-extras ul{padding-left:20px}.print-servings{display:none}
@media(max-width:760px){.site-header,main,footer{width:calc(100% - 40px)}.site-header{min-height:90px}.header-note{font-size:14px}.intro{padding-top:48px}h1{letter-spacing:-2px}.intro-bottom{align-items:start;flex-direction:column;gap:20px}.collection-heading{align-items:start}h2{font-size:26px}.search-row{flex-direction:column}.sort{align-self:flex-start}.recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.recipe-card{padding:20px}.recipe-card h3{font-size:25px}dialog{padding:20px}.recipe-columns{grid-template-columns:1fr;gap:20px}.detail-title{font-size:36px}}
@media(max-width:460px){.header-note{display:none}.recipe-grid{grid-template-columns:1fr}.collection-heading{flex-direction:column;gap:8px}.category{padding:7px 12px}.brand{font-size:44px}footer{flex-direction:column;gap:8px}.dialog-toolbar .button{padding:9px 12px}.intro-bottom p{font-size:14px}}
@media print{@page{margin:0.65in}html,body{background:#fff!important;color:#000!important;font-size:11pt}body>*{display:none!important}body>dialog[open]{display:block!important;position:static;width:100%;max-width:none;height:auto;max-height:none;margin:0;padding:0;border:0;overflow:visible}dialog::backdrop{display:none}.dialog-toolbar,.serving-control{display:none!important}.print-servings{display:block;font-size:10pt}.detail-title{font-size:28pt}.detail-meta,.ingredients li,.directions,.detail-extras{font-size:10pt}.recipe-columns{grid-template-columns:1fr 1.6fr;gap:24pt}.recipe-columns h3,.detail-extras h3{font-size:16pt}h2,h3{break-after:avoid}.ingredients li,.directions li{break-inside:avoid}a{color:#000;text-decoration:none}}

</style>

</head>
<body>
  <a class="skip" href="#recipes">Skip to recipes</a>
  <header class="site-header"><a class="brand" href="#" aria-label="Miltier Family Recipes home">M<span class="brand-rule"></span><span>MILTIER<br>FAMILY RECIPES</span></a><span class="header-note">A place at our table.</span></header>
  <main>
    <section class="intro" aria-labelledby="page-title"><p class="eyebrow">THE FAMILY COOKBOOK</p><h1 id="page-title">Good food.<br>Shared together.</h1><div class="intro-bottom"><p>Our recipes, all in one place.<br>Made to be cooked, shared, and passed around.</p><span class="collection-count" id="total-count">0 recipes in the collection</span></div></section>
    <section id="recipes" class="collection" aria-label="Recipe collection">
      <div class="collection-heading"><h2>Find your next favorite.</h2><button id="favorites" class="text-button" aria-pressed="false">♡ Saved recipes</button></div>
      <div class="search-row"><label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">Search recipes, ingredients, or family members</span><input id="search" type="search" placeholder="Search recipes, ingredients, or family members…" autocomplete="off"></label><label class="sort"><span>Sort by</span><select id="sort"><option value="title">Recipe name</option><option value="source">Family member</option></select></label></div>
      <div class="categories" role="group" aria-label="Filter by category"></div>
      <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
      <div id="recipe-grid" class="recipe-grid"></div>
      <div id="empty" class="empty" hidden><span class="empty-mark" aria-hidden="true">M.</span><h3 id="empty-title"></h3><p id="empty-message"></p><button id="clear-filters" class="button" hidden>Clear filters</button></div>
    </section>
  </main>
  <footer><span>MILTIER FAMILY RECIPES</span><span>From our kitchen to yours.</span></footer>
  <dialog id="recipe-dialog" aria-labelledby="recipe-title"><div class="dialog-toolbar"><button id="close-recipe" class="text-button">← Back to recipes</button><button id="print-recipe" class="button">Print recipe</button></div><article id="recipe-detail"></article></dialog>
<script>
// Add family recipes to this list using the format in README.md.
// Keep each recipe's id unique. No example recipes are included as family recipes.
window.RECIPES = [];

(() => {
  'use strict';
  const recipes = Array.isArray(window.RECIPES) ? window.RECIPES : [];
  const categories = ['All recipes', 'Mains', 'Sides', 'Appetizers', 'Breakfast', 'Desserts', 'Holiday'];
  const $ = selector => document.querySelector(selector);
  const make = (tag, className, content) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (content !== undefined) element.textContent = content;
    return element;
  };
  let saved;
  try {
    const value = JSON.parse(localStorage.getItem('miltier-favorites') || '[]');
    saved = new Set(Array.isArray(value) ? value.filter(id => typeof id === 'string') : []);
  } catch { saved = new Set(); }
  let category = 'All recipes', savedOnly = false, activeRecipe = null, opener = null;
  const list = value => Array.isArray(value) ? value : [];
  const servingBase = recipe => Number(recipe.servings) > 0 ? Number(recipe.servings) : 4;
  function saveButton(recipe) {
    const button = make('button', 'save', saved.has(recipe.id) ? '♥' : '♡');
    button.type = 'button';
    button.setAttribute('aria-label', `${saved.has(recipe.id) ? 'Unsave' : 'Save'} ${recipe.title}`);
    button.setAttribute('aria-pressed', String(saved.has(recipe.id)));
    button.addEventListener('click', () => {
      if (saved.has(recipe.id)) saved.delete(recipe.id); else saved.add(recipe.id);
      try { localStorage.setItem('miltier-favorites', JSON.stringify([...saved])); } catch { /* Favorites remain available during this visit. */ }
      render();
      const replacement = [...document.querySelectorAll('.save')].find(item => item.dataset.recipeId === recipe.id);
      (replacement || $('#favorites')).focus();
    });
    button.dataset.recipeId = recipe.id;
    return button;
  }
  function render() {
    const query = $('#search').value.trim().toLowerCase();
    const filtered = recipes.filter(recipe => {
      const searchable = [recipe.title, recipe.createdBy, ...list(recipe.tags), ...list(recipe.ingredients).map(item => item.i)].join(' ').toLowerCase();
      return (category === 'All recipes' || recipe.category === category) && (!savedOnly || saved.has(recipe.id)) && searchable.includes(query);
    }).sort((a, b) => String($('#sort').value === 'source' ? a.createdBy || '' : a.title || '').localeCompare(String($('#sort').value === 'source' ? b.createdBy || '' : b.title || '')));
    $('#recipe-grid').replaceChildren();
    for (const recipe of filtered) {
      const card = make('article', 'recipe-card');
      card.append(make('p', 'card-category', recipe.category || 'Recipe'), saveButton(recipe));
      const heading = make('h3');
      const open = make('button', 'card-open', recipe.title);
      open.addEventListener('click', () => openRecipe(recipe, open));
      heading.append(open);
      card.append(heading, make('p', 'card-source', recipe.createdBy ? `From ${recipe.createdBy}` : 'From the family collection'));
      const meta = make('div', 'card-meta');
      meta.append(make('span', '', `Serves ${servingBase(recipe)}`), make('span', '', recipe.time || 'View recipe →'));
      card.append(meta);
      $('#recipe-grid').append(card);
    }
    $('#result-count').textContent = `${filtered.length} ${filtered.length === 1 ? 'recipe' : 'recipes'}${savedOnly ? ' saved' : ''}`;
    $('#empty').hidden = filtered.length > 0;
    const firstVisit = recipes.length === 0;
    $('#empty-title').textContent = firstVisit ? 'The next family favorite starts here.' : 'No recipes found.';
    $('#empty-message').textContent = firstVisit ? 'Your cookbook is ready. Once family recipes are added, you can find them here, save your favorites, and print a copy for the kitchen.' : 'Try another search or category, or clear your filters to see the full collection.';
    $('#clear-filters').hidden = firstVisit;
  }
  function formatQuantity(value) {
    return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(3)));
  }
  function renderIngredients(servings) {
    const ingredients = $('#detail-ingredients');
    ingredients.replaceChildren();
    for (const item of list(activeRecipe.ingredients)) {
      const quantity = typeof item.q === 'number' ? formatQuantity(item.q * servings / servingBase(activeRecipe)) : '';
      ingredients.append(make('li', '', [quantity, item.u, item.i].filter(part => part !== '' && part != null).join(' ')));
    }
    $('.print-servings').textContent = `Servings: ${servings}`;
  }
  function openRecipe(recipe, trigger) {
    activeRecipe = recipe;
    opener = trigger;
    const detail = $('#recipe-detail');
    detail.replaceChildren(make('p', 'eyebrow', recipe.category || 'FAMILY RECIPE'));
    const title = make('h2', 'detail-title', recipe.title);
    title.id = 'recipe-title';
    detail.append(title, make('p', 'detail-meta', [recipe.createdBy ? `From ${recipe.createdBy}` : '', recipe.time].filter(Boolean).join(' · ')));
    if (recipe.story) detail.append(make('p', 'story', recipe.story));
    const control = make('label', 'serving-control', 'Servings');
    const servings = make('input');
    servings.type = 'number'; servings.min = '1'; servings.max = '1000'; servings.step = '1'; servings.value = servingBase(recipe);
    servings.addEventListener('input', () => {
      if (servings.validity.valid && servings.value !== '') renderIngredients(Number(servings.value));
    });
    servings.addEventListener('change', () => {
      if (!servings.validity.valid || servings.value === '') servings.value = servingBase(recipe);
      renderIngredients(Number(servings.value));
    });
    control.append(servings);
    detail.append(control, make('p', 'print-servings'));
    const columns = make('div', 'recipe-columns');
    const left = make('section'), right = make('section');
    const ingredients = make('ul', 'ingredients'); ingredients.id = 'detail-ingredients';
    left.append(make('h3', '', 'Ingredients'), ingredients);
    const steps = make('ol', 'directions');
    for (const step of list(recipe.steps)) steps.append(make('li', '', step));
    right.append(make('h3', '', 'Directions'), steps);
    columns.append(left, right); detail.append(columns);
    for (const [key, label] of [['swaps', 'Simple swaps'], ['extras', 'Make it your own'], ['pairIdeas', 'Serve it with']]) {
      if (!list(recipe[key]).length) continue;
      const section = make('section', 'detail-extras'), items = make('ul');
      for (const item of recipe[key]) items.append(make('li', '', item));
      section.append(make('h3', '', label), items); detail.append(section);
    }
    renderIngredients(servingBase(recipe));
    $('#recipe-dialog').showModal();
    $('#close-recipe').focus();
  }
  for (const name of categories) {
    const button = make('button', 'category', name);
    button.setAttribute('aria-pressed', String(name === category));
    button.addEventListener('click', () => {
      category = name;
      document.querySelectorAll('.category').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      render();
    });
    $('.categories').append(button);
  }
  $('#search').addEventListener('input', render);
  $('#sort').addEventListener('change', render);
  $('#favorites').addEventListener('click', () => {
    savedOnly = !savedOnly;
    $('#favorites').setAttribute('aria-pressed', String(savedOnly));
    $('#favorites').textContent = `${savedOnly ? '♥' : '♡'} Saved recipes`;
    render();
  });
  $('#clear-filters').addEventListener('click', () => {
    category = 'All recipes'; savedOnly = false; $('#search').value = '';
    $('#favorites').setAttribute('aria-pressed', 'false'); $('#favorites').textContent = '♡ Saved recipes';
    document.querySelectorAll('.category').forEach(item => item.setAttribute('aria-pressed', String(item.textContent === category)));
    render(); $('#search').focus();
  });
  $('#close-recipe').addEventListener('click', () => $('#recipe-dialog').close());
  $('#recipe-dialog').addEventListener('close', () => { if (opener?.isConnected) opener.focus(); });
  $('#print-recipe').addEventListener('click', () => window.print());
  $('#total-count').textContent = `${recipes.length} ${recipes.length === 1 ? 'recipe' : 'recipes'} in the collection`;
  render();
})();

</script>
</body>
</html>
